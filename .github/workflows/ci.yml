name: CI

# Pull requests are the gate; `dev` is only ever merged to `main` through one. Listening on `push` for `dev` as well would run every job
# twice for the same commit - once for the branch, once for the PR - so `push` is limited to `main` as the post-merge check.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# A new commit on a PR branch cancels that PR's in-flight run instead of queueing a second one behind it. Pushes to `main` are never
# cancelled, so every commit that lands on the default branch keeps its own verified result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The complete policy corpus is a release gate, not only a local preflight check.
  deny-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Full deny-dangerous corpus
        run: bash workflow/hooks/deny-dangerous.sh --self-test=full

  # Lint, format, audit, and the cross-file consistency checks. Split from the test jobs so a formatting failure surfaces in about a minute
  # instead of behind the full suite.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Create gitignored runtime dirs
        run: |
          # Project runtime dirs (gitignored, needed by path-resolution checks)
          mkdir -p .goat-flow/learning-loop/footguns .goat-flow/learning-loop/lessons .goat-flow/state/locks

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit

      - name: Build
        run: npm run build

      - name: Lint
        run: npx eslint src/cli src/dashboard

      - name: Format check
        run: npm run format:check

      - name: GOAT Flow Audit
        run: node dist/cli/cli.js audit .

      - name: Learning-loop stats check
        run: node dist/cli/cli.js stats . --check

      # Shell surfaces mirror scripts/preflight-checks.sh and CLAUDE.md Essential Commands. The installed hook mirrors under
      # .goat-flow/hooks/ are tracked copies of workflow/hooks/ and exist in a fresh checkout, so they are checked alongside the sources:
      # the aggregate audit step above pins the dispatcher and launcher mirrors to their templates but not the deny-dangerous/ policy
      # modules, and the deny-corpus job exercises the installed modules behaviourally, not byte-for-byte. Same exclusions as preflight:
      # SC2016 only for hook modules whose sed patterns intentionally use single quotes.
      - name: Shellcheck
        run: |
          # The runner image ships shellcheck; install only covers an image that ever stops shipping it.
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          shellcheck --exclude=SC2001 scripts/*.sh scripts/maintenance/*.sh scripts/installers/*.sh workflow/install-goat-flow.sh
          shellcheck --exclude=SC2001 workflow/hooks/*.sh workflow/hooks/deny-dangerous/*.sh .goat-flow/hooks/*.sh .goat-flow/hooks/deny-dangerous/*.sh

      - name: Shell syntax
        run: bash scripts/maintenance/check-shell-syntax.sh

      - name: Instruction parity
        run: node scripts/check-instruction-parity.mjs

      - name: Path integrity
        run: bash scripts/check-path-integrity.sh .

      - name: Version consistency (shared script)
        run: npm run check-versions

      - name: Package links
        run: npm run check-package-links

      - name: Version consistency
        run: |
          pkg_version=$(node -e "console.log(require('./package.json').version)")
          # AUDIT_VERSION derives from package.json since v1.1.0
          audit_version="$pkg_version"

          echo "package.json: $pkg_version"
          echo "AUDIT_VERSION: $audit_version"

          # AUDIT_VERSION should be valid
          if [ -z "$audit_version" ]; then
            echo "::error::AUDIT_VERSION not found - check package.json version field"
            exit 1
          fi

          # Instruction file headers (current agent surfaces; AGENTS.md is
          # shared by Codex and Antigravity - list it once)
          for f in CLAUDE.md AGENTS.md .github/copilot-instructions.md; do
            if [ -f "$f" ]; then
              header_version=$(head -1 "$f" | grep -oE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/^v//' || true)
              if [ -n "$header_version" ] && [ "$header_version" != "$pkg_version" ]; then
                echo "::error::$f header says v${header_version}, expected v${pkg_version}"
                exit 1
              fi
              echo "$f: v${header_version:-none}"
            fi
          done

          # Config version
          if [ -f .goat-flow/config.yaml ]; then
            config_version=$(grep '^version:' .goat-flow/config.yaml | grep -oE '"[^"]+"' | tr -d '"' || true)
            if [ -n "$config_version" ] && [ "$config_version" != "$pkg_version" ]; then
              echo "::error::.goat-flow/config.yaml version ($config_version) does not match package.json ($pkg_version)"
                exit 1
            fi
          fi

      - name: Skill template versions
        run: |
          # AUDIT_VERSION derives from package.json since v1.1.0
          skill_version=$(node -e "console.log(require('./package.json').version)")
          echo "Expected skill version: $skill_version"

          fail=0
          for f in workflow/skills/*/SKILL.md; do
            ver=$(grep -o 'goat-flow-skill-version: "[^"]*"' "$f" | grep -o '"[^"]*"' | tr -d '"' || true)
            if [ "$ver" != "$skill_version" ]; then
              echo "::error::$f has version '$ver', expected '$skill_version'"
              fail=1
            fi
          done

          for dir in .claude/skills .agents/skills .github/skills; do
            if [ -d "$dir" ]; then
              for f in $(find "$dir" -name 'SKILL.md'); do
                ver=$(grep -o 'goat-flow-skill-version: "[^"]*"' "$f" | grep -o '"[^"]*"' | tr -d '"' || true)
                if [ -n "$ver" ] && [ "$ver" != "$skill_version" ]; then
                  echo "::error::$f has version '$ver', expected '$skill_version'"
                  fail=1
                fi
              done
            fi
          done

          if [ "$fail" -eq 1 ]; then exit 1; fi
          echo "All skill templates at version $skill_version"

  # The concurrent unit/contract suite (scripts/run-tests.mjs fast).
  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Create gitignored runtime dirs
        run: |
          # Project runtime dirs (gitignored, needed by path-resolution tests)
          mkdir -p .goat-flow/learning-loop/footguns .goat-flow/learning-loop/lessons .goat-flow/state/locks

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Path write claim and state migration contracts
        run: node --import tsx --test test/unit/path-write-claim.test.ts test/integration/local-state-migration.test.ts

      # Only the fast suite pins jq: gruff-code-quality-smoke.test.ts asserts against jq 1.6 behaviour.
      - name: Provision jq 1.6
        run: |
          set -euo pipefail
          jq16_dir="$RUNNER_TEMP/goat-flow-jq16"
          jq16_sha="af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44"
          mkdir -p "$jq16_dir"
          curl -fsSL -o "$jq16_dir/jq-linux64" "https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64"
          printf '%s  jq-linux64\n' "$jq16_sha" > "$jq16_dir/jq-linux64.sha256"
          (cd "$jq16_dir" && sha256sum --check jq-linux64.sha256)
          chmod +x "$jq16_dir/jq-linux64"
          echo "GOAT_FLOW_JQ16_BIN=$jq16_dir/jq-linux64" >> "$GITHUB_ENV"
          echo "system jq: $(jq --version 2>/dev/null || echo unavailable)"
          echo "pinned jq: $("$jq16_dir/jq-linux64" --version)"

      - name: Test (fast)
        run: npm run test:fast

  # The subprocess-heavy suite, split across runners because its files must stay single-concurrency within one checkout: several share
  # repository-root state such as .goat-flow/dashboard-state.json. Shards get separate checkouts, so the split is safe where raising
  # --test-concurrency is not. scripts/run-tests.mjs balances files by measured cost and assigns each file to exactly one shard.
  test-slow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    name: test-slow (${{ matrix.shard }}/5)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Create gitignored runtime dirs
        run: |
          # Project runtime dirs (gitignored, needed by path-resolution tests)
          mkdir -p .goat-flow/learning-loop/footguns .goat-flow/learning-loop/lessons .goat-flow/state/locks

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (slow shard ${{ matrix.shard }}/5)
        run: npm run test:slow:ci -- --shard=${{ matrix.shard }}/5

  # Proves ADR-048/ADR-053 hook contracts and the Windows-only audit/package paths on the package-minimum Node.
  # Uses only the runner's preinstalled PowerShell, Git Bash, tar, and Node.
  windows-hook-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.11.0"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build package binary
        run: npm run build
      - name: Verification launches on package-minimum Node
        run: node --import tsx --test test/integration/preflight-progress.test.ts
      - name: Path write claim and state migration contracts
        run: node --import tsx --test test/unit/path-write-claim.test.ts test/integration/local-state-migration.test.ts
      - name: Descriptor spawn matrix and focused hook contracts
        run: node --import tsx --test test/integration/hook-command-spawn-matrix.test.ts test/integration/hook-effective-state.test.ts
      # Native Windows has no POSIX owner and a 32,767-character command line, so Stop recovery and the multi-repo controller need a real run here.
      - name: Post-turn recovery and controller contracts
        run: node --import tsx --test --test-name-pattern="blocks a missing scanner once|preserves controller child findings" test/integration/post-turn-launcher-recovery.test.ts
      # Node cannot start npm `.cmd` runner shims without a shell, so only this job exercises the dashboard's PowerShell version probe.
      - name: Dashboard runner version probe
        run: node --import tsx --test --test-name-pattern="npm shim version through PowerShell" test/unit/terminal-spawn.test.ts
      - name: Windows audit contract
        run: node --import tsx --test test/unit/audit-command/agent-deny-hooks-drift.test.ts
      - name: Windows packaged install contract
        run: node --import tsx --test --test-name-pattern="runs fresh install through the archived CLI bin" test/integration/packaged-hook-install.test.ts

  # Build with supported tooling before switching to each consumer runtime. These
  # controls establish the port harness; owning milestones add candidate hooks.
  hook-port-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20.11.0", "24.21.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Record consumer identity
        run: node -e "console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,commit:process.env.GITHUB_SHA}))"
      - name: Restricted process and selector controls
        run: node --import tsx --test test/integration/restricted-env-controls.test.ts test/unit/hook-entrypoint.test.ts
      # npm pack invokes the platform npm shim outside the restricted child.
      - name: Corpus and package controls
        run: node --import tsx --test test/integration/hook-parity.test.ts

  # Bash extraction stays on native Linux with pinned jq and explicit locales.
  # macOS runs the Node controls above, never reference extraction.
  hook-reference-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [C, C.UTF-8]
    env:
      GOAT_FLOW_HOOK_UNDER_TEST: reference
      LC_ALL: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Provision reference jq 1.6
        run: |
          set -euo pipefail
          jq_dir="$RUNNER_TEMP/reference-bin"
          mkdir -p "$jq_dir"
          curl -fsSL -o "$jq_dir/jq" https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64
          echo "af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44  $jq_dir/jq" | sha256sum --check
          chmod +x "$jq_dir/jq"
          echo "$jq_dir" >> "$GITHUB_PATH"
          echo "GOAT_FLOW_JQ16_BIN=$jq_dir/jq" >> "$GITHUB_ENV"
      - name: Record reference identity
        run: node --version && uname -a && git rev-parse HEAD && jq --version && locale
      - name: Frozen policy invariants
        run: node --import tsx --test --test-concurrency=1 test/integration/deny-dangerous-policy.test.ts test/integration/deny-native-shells.test.ts test/integration/deny-dangerous-operands.test.ts test/integration/deny-git-graphql.test.ts
      - name: Frozen scanner and recovery invariants
        run: node --import tsx --test --test-concurrency=1 test/integration/post-turn-safety-hook*.test.ts test/integration/post-turn-safety-controller.test.ts test/integration/post-turn-launcher-recovery.test.ts
      - name: Frozen Gruff and provider invariants
        run: node --import tsx --test --test-concurrency=1 test/integration/gruff-code-quality-contract.test.ts test/integration/gruff-code-quality-smoke.test.ts test/integration/gruff-code-quality-quiet-feedback.test.ts test/integration/hook-provider-contracts.test.ts
      - name: Frozen extraction controls
        run: node --import tsx --test test/integration/hook-parity-reference.test.ts

  # WSL has its own identity and receipts; a native Windows pass cannot credit it.
  # Fail closed if the disposable hosted runner cannot provide WSL2.
  hook-port-controls-wsl:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Ubuntu/WSL/.github/actions/wsl-install@3b7a6b2a43af18aa541eeee1669ac27656630097
        with:
          distro: Ubuntu-22.04
      - name: Require WSL2
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          $listing = (wsl --list --verbose) -replace "`0", ''
          if ($LASTEXITCODE -ne 0) { throw 'WSL2 identity query failed' }
          if (($listing -join "`n") -notmatch 'Ubuntu-22\.04\s+\S+\s+2\s*') {
            wsl --set-version Ubuntu-22.04 2
            if ($LASTEXITCODE -ne 0) { throw 'WSL2 conversion failed' }
            $listing = (wsl --list --verbose) -replace "`0", ''
          }
          $listing
          if ($LASTEXITCODE -ne 0 -or ($listing -join "`n") -notmatch 'Ubuntu-22\.04\s+\S+\s+2\s*') { throw 'WSL2 identity missing' }
      - name: WSL floor and LTS controls
        uses: Ubuntu/WSL/.github/actions/wsl-bash@3b7a6b2a43af18aa541eeee1669ac27656630097
        with:
          distro: Ubuntu-22.04
          exec: |
            set -euo pipefail
            uname -a
            grep -i 'microsoft.*WSL2' /proc/sys/kernel/osrelease
            apt-get update
            apt-get install -y ca-certificates curl git xz-utils procps python3 build-essential
            source_path=$(wslpath -u '${{ github.workspace }}')
            work_path=$(mktemp -d /tmp/goat-flow-ci-XXXXXXXX)
            printf '%s\n' "$work_path" > /tmp/goat-flow-ci-path
            cp -a "$source_path/." "$work_path/"
            cd "$work_path"
            git config --global --add safe.directory "$work_path"
            git rev-parse HEAD
            for version in 24.21.0 20.11.0; do
              archive="node-v$version-linux-x64.tar.xz"
              curl -fsSLO "https://nodejs.org/dist/v$version/$archive"
              curl -fsSL "https://nodejs.org/dist/v$version/SHASUMS256.txt" | grep "  $archive$" > "$archive.sha256"
              sha256sum --check "$archive.sha256"
              tar -xf "$archive"
            done
            export PATH="$work_path/node-v24.21.0-linux-x64/bin:$PATH"
            npm ci --foreground-scripts
            npm run build
            for version in 20.11.0 24.21.0; do
              export PATH="$work_path/node-v$version-linux-x64/bin:$PATH"
              node --version
              node --import tsx --test test/integration/restricted-env-controls.test.ts test/unit/hook-entrypoint.test.ts
              node --import tsx --test test/integration/hook-parity.test.ts
            done
      - name: WSL frozen divergence report
        uses: Ubuntu/WSL/.github/actions/wsl-bash@3b7a6b2a43af18aa541eeee1669ac27656630097
        with:
          distro: Ubuntu-22.04
          exec: |
            set -euo pipefail
            work_path=$(cat /tmp/goat-flow-ci-path)
            cd "$work_path"
            export PATH="$work_path/node-v24.21.0-linux-x64/bin:$PATH"
            jq_dir=$(mktemp -d /tmp/goat-flow-jq-XXXXXXXX)
            curl -fsSL -o "$jq_dir/jq" https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64
            echo "af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44  $jq_dir/jq" | sha256sum --check
            chmod +x "$jq_dir/jq"
            export PATH="$jq_dir:$PATH" GOAT_FLOW_JQ16_BIN="$jq_dir/jq"
            for locale in C C.UTF-8; do
              LC_ALL="$locale" node scripts/check-hook-parity.mjs --stage=extraction --list-divergent
            done

  # Divergence is reported separately from candidate acceptance. Both locales and
  # the complete frozen corpus are retained, including approved differences.
  hook-reference-git-bash:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [C, C.UTF-8]
    env:
      LC_ALL: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          cache: "npm"
      - run: npm ci
      - name: Provision reference jq 1.6
        shell: pwsh
        run: |
          $jqDir = Join-Path $env:RUNNER_TEMP 'reference-bin'
          New-Item -ItemType Directory -Path $jqDir | Out-Null
          $jqPath = Join-Path $jqDir 'jq.exe'
          Invoke-WebRequest https://github.com/jqlang/jq/releases/download/jq-1.6/jq-win64.exe -OutFile $jqPath
          if ((Get-FileHash $jqPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a51d36968dcbdeabb3142c6f5cf9b401a65dc3a095f3144bd0c118d5bb192753') { throw 'jq checksum mismatch' }
          $jqDir | Out-File -FilePath $env:GITHUB_PATH -Append
          "GOAT_FLOW_JQ16_BIN=$jqPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Record divergence and host identity
        shell: bash
        run: |
          set -euo pipefail
          node --version
          uname -a
          git rev-parse HEAD
          jq --version
          locale
          node scripts/check-hook-parity.mjs --stage=extraction --list-divergent

  # Reviewed Gruff warning-debt ratchet (scripts/check-gruff-warning-ratchet.mjs
  # against scripts/gruff-warning-baseline.json). Runs in a dedicated job
  # because the analyzer package requires Node 22 while the compatibility jobs
  # intentionally keep Node 20 compatibility coverage.
  gruff-warning-ratchet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build package binary
        run: npm run build
      - name: Gruff warning ratchet
        run: node scripts/check-gruff-warning-ratchet.mjs
      - name: Verification launch contracts
        run: node --import tsx --test test/integration/preflight-progress.test.ts test/integration/gruff-warning-ratchet.test.ts
